<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>enjoyfootgr</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#f5f7ff}
header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:#111a31;position:sticky;top:0;z-index:5}
.logo{font-weight:900;font-size:24px}.logo span{color:#53e36b}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}
.primary{background:#53e36b;color:#07120a}.ghost{background:#222d4a;color:#fff}
main{max-width:1100px;margin:auto;padding:28px 18px}
.hero{background:linear-gradient(135deg,#16284a,#102719);padding:30px;border-radius:20px;margin-bottom:24px}
.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:#b9c4d9}
.actions{display:flex;gap:10px;flex-wrap:wrap}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input,select,textarea{background:#121b31;border:1px solid #30405f;color:#fff;padding:11px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:#121a2e;border:1px solid #263653;border-radius:16px;padding:18px}
.badge{display:inline-block;background:#243653;padding:5px 9px;border-radius:99px;font-size:12px;margin:3px}
.open{color:#53e36b}.full{color:#ff6b6b}.top{display:flex;justify-content:space-between;gap:12px}
.rating{font-size:30px;font-weight:900;color:#ffd45c}.players{margin:15px 0;height:8px;background:#28344f;border-radius:20px}.players i{display:block;height:100%;background:#53e36b;border-radius:20px}
.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;background:#263653}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{background:#111a2f;border:1px solid #334667;border-radius:18px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#1a2540;padding:10px;border-radius:10px;text-align:center}.stat b{display:block;font-size:22px}
.profile{display:flex;gap:18px;align-items:center}.small{color:#9eabc2;font-size:13px}
.notice{padding:12px;background:#1b2a43;border-radius:10px;margin-top:10px}
@media(max-width:600px){.hero h1{font-size:30px}.row{grid-template-columns:1fr}.profile{align-items:flex-start}}

.fieldbox{background:#18243c;border:1px solid #30405f;border-radius:12px;padding:12px;margin:12px 0}
.fieldtitle{font-weight:900;font-size:16px}.fieldaddr{font-size:13px;color:#aebbd1;margin:5px 0}
.mapbtn{display:inline-block;text-decoration:none;background:#243653;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;margin-top:5px}
.areaTabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}.areaTabs button.active{background:#53e36b;color:#07120a}

.requests{margin-top:14px;border-top:1px solid #30405f;padding-top:12px}.request{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#18243c;border-radius:10px;padding:9px;margin:6px 0}.mini{font-size:12px;color:#aebbd1}
.usercard{display:flex;gap:12px;align-items:center}.miniavatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#263653}

.areaSearchWrap{position:relative;min-width:230px}.areaSearchWrap input{width:100%;margin-bottom:6px}.areaSearchWrap select{width:100%;max-height:180px}
.areaHint{font-size:12px;color:#91a0b9;margin-top:4px}

.chat{display:grid;gap:8px;margin:12px 0}.msg{padding:9px 12px;border-radius:12px;background:#1b2944;max-width:85%}.msg.me{margin-left:auto;background:#244c35}.chatinput{display:flex;gap:8px}.chatinput input{flex:1}.notif{background:#243653;border-radius:10px;padding:10px;margin:7px 0}

.authbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.userpill{background:#1c2a43;padding:8px 11px;border-radius:10px;font-size:13px}.authstatus{margin-top:10px;color:#aebbd1}.error{background:#4b1f27;color:#ffd9de;padding:10px;border-radius:10px}.success{background:#183a27;color:#d9ffe7;padding:10px;border-radius:10px}

<style id="enjoyfoot-team-style">
.teamhero{background:linear-gradient(135deg,#1a2d50,#2b1d0d);border:1px solid #3b4c6d;border-radius:16px;padding:18px;margin:10px 0}
.teamname{font-size:28px;font-weight:900}.teamrecord{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.teamstat{background:#18243c;border-radius:10px;padding:9px 12px}.teammember{display:flex;align-items:center;gap:10px;background:#18243c;border-radius:10px;padding:9px;margin:6px 0}.teammember img{width:42px;height:42px;border-radius:50%;object-fit:cover}.team-actions{display:flex;gap:8px;flex-wrap:wrap}.teamsearch{display:grid;grid-template-columns:1fr auto;gap:8px}

/* ===== Νέα αγγελία — modern layout ===== */
.ad-form-shell{display:flex;flex-direction:column;gap:14px}
.ad-section{background:linear-gradient(180deg,#0e1a2d,#0a1526);border:1px solid #263b5c;border-radius:14px;padding:16px}
.ad-section-title{font-size:17px;font-weight:800;margin-bottom:12px}
.ad-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ad-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ad-label{font-size:13px;color:#aebbd0;margin:0 0 6px 2px;display:block}
.ad-field{width:100%;box-sizing:border-box}
.ad-player-row{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;align-items:center;margin-top:8px}
.ad-player-row select{width:100%}
.ad-counter{display:flex;align-items:center;gap:0}
.ad-counter button{width:38px;height:40px;border:0;background:#182943;color:#fff;font-size:20px}
.ad-counter input{width:54px;text-align:center;height:40px;border:0;background:#101e33;color:#fff;font-weight:800}
.ad-add-position{margin-top:10px}
.ad-total{text-align:right;font-weight:800;margin-top:12px}
.ad-actions{display:flex;gap:10px;justify-content:flex-end}
.ad-publish{min-width:240px}
@media(max-width:700px){
 .ad-grid-2,.ad-grid-4{grid-template-columns:1fr 1fr}
 .ad-player-row{grid-template-columns:1fr 125px 38px}
}
@media(max-width:500px){
 .ad-grid-2,.ad-grid-4{grid-template-columns:1fr}
 .ad-player-row{grid-template-columns:1fr}
 .ad-actions{flex-direction:column}
 .ad-publish{width:100%}
}
</style>
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* enjoyfootgr stable form polish */
.form input[type="date"], .form input[type="time"]{
  min-height:46px; cursor:pointer; font-size:16px;
}
.form input[type="date"]::-webkit-calendar-picker-indicator,
.form input[type="time"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.9}
.create-date-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.create-date-row{grid-template-columns:1fr}}
</style>

<style id="enjoyfoot-player-card-style">
.enjoy-player-card-wrap{display:flex;justify-content:center;padding:18px 8px}
.enjoy-player-card{
  width:min(330px,92vw);aspect-ratio:0.70;position:relative;overflow:hidden;
  border-radius:24px;padding:22px 18px;color:#2d2418;
  background:linear-gradient(145deg,#f8e8b0 0%,#fff7d7 45%,#d6b86a 100%);
  box-shadow:0 18px 45px rgba(0,0,0,.28), inset 0 0 0 2px rgba(255,255,255,.65);
  font-family:Arial,sans-serif;
}
.enjoy-player-card:before{content:"";position:absolute;inset:8px;border:1px solid rgba(96,67,18,.35);border-radius:19px;pointer-events:none}
.enjoy-card-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.enjoy-card-rating{font-size:42px;font-weight:900;line-height:.9}
.enjoy-card-pos{font-size:16px;font-weight:800;margin-top:5px;text-transform:uppercase}
.enjoy-card-name{font-size:24px;font-weight:900;text-align:center;margin:4px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.enjoy-card-photo{height:190px;display:flex;justify-content:center;align-items:flex-end;position:relative;z-index:1}
.enjoy-card-photo img{max-width:88%;max-height:190px;object-fit:contain;filter:drop-shadow(0 9px 8px rgba(0,0,0,.28))}
.enjoy-card-divider{height:1px;background:rgba(75,51,13,.35);margin:5px 12px 10px}
.enjoy-card-meta{text-align:center;font-size:12px;margin-top:10px;opacity:.8}
</style>


<style id="enjoyfoot-venue-picker-style">
.enjoy-venue-picker{position:relative;margin-top:8px}
.enjoy-venue-picker input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #ccc;border-radius:12px;font-size:16px}
.enjoy-venue-status{font-size:12px;margin-top:6px;opacity:.72}
.enjoy-venue-selected{margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.05)}
</style>
</head>
<body>
<header><div class="logo">⚽ enjoy<span>footgr</span></div><div class="authbar"><button class="ghost" onclick="openProfile()">👤 Το προφίλ μου</button><button class="ghost" onclick="openMyTeam()">👑 Η ομάδα μου</button><span id="authUser" class="userpill">Δεν έχεις συνδεθεί</span><button id="authBtn" class="ghost" onclick="openAuth()">🔐 Εγγραφή / Σύνδεση</button></div></header>
<main>
<section class="hero">
<h1>Βρες παίκτη. Φτιάξε ομάδα. Παίξε στο enjoyfootgr.</h1>
<p>Αγγελίες για 5x5, 7x7 και 11x11 — με πραγματικά γήπεδα και προφίλ παικτών σε στυλ FIFA.</p>
<div class="actions"><button class="primary" onclick="openCreate()">＋ Δημιούργησε αγγελία</button><button class="ghost" onclick="showPlayers()">👥 Βρες παίκτη</button><button class="ghost" onclick="showMyApplications()">📩 Τα αιτήματά μου</button></div>
</section>
<div class="filters">
<select id="formatFilter" onchange="renderGames()"><option value="">⚽ Όλα τα formats</option><option value="5x5">5x5</option><option value="7x7">7x7</option><option value="11x11">11x11</option></select>
<div class="areaSearchWrap"><input id="areaSearch" placeholder="📍 Γράψε περιοχή ή πόλη..." oninput="filterAreas()"><select id="areaFilter" onchange="renderGames()"><option value="">📍 Όλη η Ελλάδα</option></select></div>
<select id="positionFilter" onchange="renderGames()"><option value="">Όλες οι θέσεις</option><option>GK</option><option>CB</option><option>LB</option><option>RB</option><option>CDM</option><option>CM</option><option>CAM</option><option>LM</option><option>RM</option><option>LW</option><option>RW</option><option>ST</option></select>
<input id="search" placeholder="🔎 Περιοχή / θέση / γήπεδο" oninput="renderGames()"></div>
<h2>🔥 Διαθέσιμα παιχνίδια</h2><div id="games" class="grid"></div>
</main>

<div class="modal" id="modal"><div class="modalbox" id="modalContent"></div></div>

<script>
const greekAreas=["Αθήνα","Αιγάλεω","Άλιμος","Αμαλιάδα","Αλεξανδρούπολη","Άργος","Άρτα","Βέροια","Βόλος","Γιάννενα","Γρεβενά","Δράμα","Έδεσσα","Ελευσίνα","Ηράκλειο","Θεσσαλονίκη","Θήβα","Καβάλα","Καλαμάτα","Καλλιθέα","Καρδίτσα","Κατερίνη","Καλαμαριά","Καστοριά","Κέρκυρα","Κιλκίς","Κοζάνη","Κομοτηνή","Κόρινθος","Λαμία","Λάρισα","Λευκάδα","Λιβαδειά","Μαρούσι","Μεσολόγγι","Μυτιλήνη","Νέα Σμύρνη","Νάουσα","Ναύπλιο","Ξάνθη","Πάτρα","Πειραιάς","Πρέβεζα","Ρέθυμνο","Ρόδος","Ρέντη","Σέρρες","Σπάρτη","Τρίκαλα","Τρίπολη","Χαλκίδα","Χανιά","Χίος","Ζωγράφου","Γέρακας","Καματερό","Σαλαμίνα","Σύρος","Κως"];
function populateAreas(list=greekAreas){
 const s=document.getElementById("areaFilter"); if(!s)return;
 const old=s.value; s.innerHTML='<option value="">📍 Όλη η Ελλάδα</option>'+list.map(a=>`<option>${a}</option>`).join('');
 if(list.includes(old)) s.value=old;
}
function filterAreas(){
 const q=(document.getElementById("areaSearch").value||"").trim().toLowerCase();
 const list=greekAreas.filter(a=>a.toLowerCase().includes(q));
 populateAreas(list);
 populateAreas();renderGames();
}
let games=[
{id:1,format:"5x5",area:"Καλλιθέα",place:"Δημοτικό Γήπεδο Μίνι Ποδοσφαίρου 5x5 Καλλιθέας",address:"Π. Τσαλδάρη & Μενελάου, Καλλιθέα 176 76",map:"https://www.google.com/maps/search/?api=1&query=Π+Τσαλδάρη+Μενελάου+Καλλιθέα",date:"Παρασκευή 22/8",time:"21:00",need:"GK",count:9,max:10,cost:"7€",creator:"Μάριος",desc:"Χρειαζόμαστε τερματοφύλακα.",applications:[]},
{id:2,format:"7x7",area:"Ρέντη",place:"Renti Arena",address:"Αγίας Άννης 46, Άγιος Ιωάννης Ρέντης 182 33",map:"https://www.google.com/maps/search/?api=1&query=Renti+Arena+Agias+Annis+46+Rentis",date:"Σάββατο 23/8",time:"20:30",need:"CM",count:11,max:14,cost:"6€",creator:"Γιάννης",desc:"Ψάχνουμε 3 άτομα για κέντρο και άμυνα.",applications:[]},
{id:3,format:"11x11",area:"Μαρούσι",place:"Campeon Football Club",address:"Παράδρομος 3ης Φραγκ. 5, Μαρούσι 151 25",map:"https://www.google.com/maps/search/?api=1&query=Campeon+Football+Club+Marousi",date:"Κυριακή 24/8",time:"19:00",need:"RB",count:19,max:22,cost:"8€",creator:"Αλέξης",desc:"Ψάχνουμε δεξί μπακ, εξτρέμ και φορ.",applications:[]},
{id:4,format:"7x7",area:"Γέρακας",place:"PLANET ONE",address:"Κλεισθένους 399, Γέρακας 153 44",map:"https://www.google.com/maps/search/?api=1&query=Planet+One+Kleisthenous+399+Gerakas",date:"Τρίτη 26/8",time:"21:30",need:"ST",count:12,max:14,cost:"8€",creator:"Νίκος",desc:"Χρειαζόμαστε 2 επιθετικούς.",applications:[]},
{id:5,format:"5x5",area:"Ζωγράφου",place:"Γήπεδο Ποδοσφαίρου 5x5",address:"Κοκκινοπούλου, Ζωγράφου 157 73",map:"https://www.google.com/maps/search/?api=1&query=Γήπεδο+Ποδοσφαίρου+5x5+Κοκκινοπούλου+Ζωγράφου",date:"Τετάρτη 27/8",time:"20:00",need:"LW",count:8,max:10,cost:"6€",creator:"Πέτρος",desc:"Ψάχνουμε αριστερό εξτρέμ και έναν χαφ.",applications:[]},
{id:6,format:"7x7",area:"Καματερό",place:"MARAKANA 7x7",address:"Αριστείδου 82, Καματερό 134 51",map:"https://www.google.com/maps/search/?api=1&query=MARAKANA+7x7+Aristidou+82+Kamatero",date:"Πέμπτη 28/8",time:"21:00",need:"CB",count:10,max:14,cost:"7€",creator:"Κώστας",desc:"Ψάχνουμε αμυντικούς.",applications:[]}
];
let messages={1:[{from:"Μάριος",text:"Καλησπέρα! Είσαι διαθέσιμος για Παρασκευή 21:00;"}],2:[],3:[],4:[],5:[],6:[]};
let profile={name:"Stelios",age:31,height:172,weight:73,position:"MID",foot:"Δεξί",rating:78,stats:{PAC:82,SHO:70,PAS:84,DRI:79,DEF:62,PHY:76},photo:""};

function positionGR(p){return ({GK:"Τερματοφύλακας",CB:"Στόπερ",LB:"Αριστερό Μπακ",RB:"Δεξί Μπακ",CDM:"Αμυντικό Χαφ",CM:"Κεντρικό Χαφ",CAM:"Μεσοεπιθετικός",LM:"Αριστερό Χαφ",RM:"Δεξί Χαφ",LW:"Αριστερό Εξτρέμ",RW:"Δεξί Εξτρέμ",ST:"Σέντερ Φορ"})[p]||p}
function renderGames(){
 const q=(document.getElementById('search').value||'').toLowerCase(), f=document.getElementById('positionFilter').value, fmt=document.getElementById('formatFilter').value, area=document.getElementById('areaFilter').value, aq=(document.getElementById('areaSearch').value||'').trim().toLowerCase();
 document.getElementById('games').innerHTML=games.filter(g=>(!fmt||g.format===fmt)&&(!area||g.area===area)&&(!aq||g.area.toLowerCase().includes(aq))&&(!f||g.need===f)&&(!q||(g.area+g.place+g.need+g.format+g.address).toLowerCase().includes(q))).map(g=>{
  let full=g.count>=g.max, left=g.max-g.count;
  return `<div class="card"><div class="top"><div><span class="badge">⚽ ${g.format}</span><span class="badge">📍 ${esc(g.area)}</span></div><b class="${full?'full':'open'}">${full?'🔴 ΚΑΤΕΛΗΦΘΗ':'🟢 ΑΝΟΙΧΤΟ'}</b></div>
  ${g.team?`<div class="badge">👑 ${esc(g.team.name)}</div>`:""}<h3>Ψάχνουμε ${left} ${left===1?'παίκτη':'παίκτες'}</h3><p>${g.desc}</p>
  <div class="fieldbox"><div class="fieldtitle">⚽ ${esc(g.place)}</div><div class="fieldaddr">📍 ${esc(g.area)}</div><a class="mapbtn" href="${g.map}" target="_blank" rel="noopener">🗺️ Χάρτης</a><a class="mapbtn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(g.place+" "+g.area)}" target="_blank" rel="noopener">🚗 Οδηγίες</a>${g.team&&g.team.owner_id===currentUser?.id?`<button class="mapbtn" onclick="openTeamById('${g.team.id}')">👑 Προβολή ομάδας</button>`:""}</div>
  <p>📅 ${g.date} · 🕘 ${g.time}<br>💰 ${g.cost}</p>
  <div class="players"><i style="width:${g.count/g.max*100}%"></i></div><b>${g.count}/${g.max} παίκτες</b>
  ${full?'<button class="ghost" style="width:100%;margin-top:14px" disabled>Η αγγελία έκλεισε</button>':'<button class="primary" style="width:100%;margin-top:14px" onclick="requestJoin('+g.id+')">🙋 Θέλω να παίξω</button>'}
  <div class="requests"><b>👥 Ενδιαφέρονται: ${g.applications.length}</b>${g.applications.length?g.applications.map((p,i)=>`<div class="request"><span>⚽ ${p.name} · ${positionGR(p.position)} · ${p.rating} OVR</span><span><button class="ghost" onclick="openChat(${g.id})">💬</button> <button class="primary" onclick="acceptPlayer(${g.id},${i})">Αποδοχή</button></span></div>`).join(''):'<div class="mini">Κανένας παίκτης δεν έχει στείλει αίτημα ακόμα.</div>'}<button class="ghost" style="width:100%;margin-top:7px" onclick="openChat(${g.id})">💬 Άνοιγμα chat αγγελίας</button></div>
  </div>`}).join('')||'<div class="notice">Δεν βρέθηκαν αγγελίες.</div>';
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function populateTeamSelect(){
  const sel=document.getElementById('teamSelect');
  if(!sel || !currentUser) return;
  const team=await loadMyTeam();
  sel.innerHTML=team ? `<option value="${team.id}">👑 ${esc(team.name)}</option>` : '<option value="">Χωρίς ομάδα</option>';
}

function openMyTeam(){
  if(!currentUser){openAuth();return}
  loadMyTeam().then(async team=>{ if(team){ renderTeamModal(team); return; } const {data:inv}=await sb.from('team_invites').select('id,team_id,note,reply_note,teams(id,name,owner_id)').eq('invited_user_id',currentUser.id).eq('status','pending').limit(1).maybeSingle(); if(inv?.teams){ document.getElementById('modalContent').innerHTML=`<h2>👑 Πρόσκληση σε ομάδα</h2><div class="teamhero"><div class="teamname">${esc(inv.teams.name)}</div><div class="mini">Σε προσκάλεσαν να γίνεις μέλος.</div>${inv.note?`<div class="notice">💬 <b>Μήνυμα από τον Admin:</b><br>${esc(inv.note)}</div>`:''}</div><textarea id="inviteReplyNote" maxlength="200" placeholder="💬 Απάντηση προς τον Admin (έως 200 χαρακτήρες)" style="width:100%;min-height:75px"></textarea><div class="mini">Μπορείς να αφήσεις και εσύ ένα σύντομο μήνυμα.</div><div class="actions"><button class="primary" onclick="acceptTeamInvite('${inv.id}','${inv.team_id}')">✅ Αποδοχή</button><button class="ghost" onclick="rejectTeamInvite('${inv.id}')">❌ Απόρριψη</button></div><button class="ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Κλείσιμο</button>`; document.getElementById('modal').classList.add('show'); } else renderCreateTeamModal(); });
}

async function loadMyTeam(){
  if(!currentUser)return null;
  const {data:owned}=await sb.from('teams').select('*').eq('owner_id',currentUser.id).maybeSingle();
  if(owned)return owned;
  const {data:mem}=await sb.from('team_members').select('team_id,teams(*)').eq('user_id',currentUser.id).maybeSingle();
  return mem?.teams||null;
}

function renderCreateTeamModal(){
  document.getElementById('modalContent').innerHTML=`<h2>👑 Δημιούργησε την ομάδα σου</h2><div class="form">

async function inviteTeamMember(teamId){
  const q=(document.getElementById('inviteSearch').value||'').trim();
  const out=document.getElementById('inviteResult'); if(q.length<2){out.textContent='Γράψε όνομα ή username.';return}
  const {data:users,error}=await sb.from('profiles').select('id,display_name,username').or(`display_name.ilike.*${q}*,username.ilike.*${q}*`).limit(5);
  if(error){out.textContent=error.message;return}
  if(!users?.length){out.textContent='Δεν βρέθηκε παίκτης.';return}
  const u=users[0]; if(u.id===currentUser.id){out.textContent='Δεν μπορείς να προσκαλέσεις τον εαυτό σου.';return}
  const note=(document.getElementById('inviteNote')?.value||'').trim().slice(0,200);
  const {error:e}=await sb.from('team_invites').upsert({team_id:teamId,invited_user_id:u.id,invited_by:currentUser.id,status:'pending',note:note||null,reply_note:null},{onConflict:'team_id,invited_user_id'});
  if(e){out.textContent=e.message;return}
  await sb.from('notifications').insert({user_id:u.id,title:'👑 Πρόσκληση σε ομάδα',body:note?`Σε προσκάλεσαν στην ομάδα: ${note}`:`Σε προσκάλεσαν στην ομάδα.`,game_id:null,application_id:null});
  out.textContent=`Η πρόσκληση στάλθηκε στον ${u.display_name||u.username||'παίκτη'}.`;
}

}

async function createGame(){
 try{
  const formatEl=document.getElementById("format"), areaEl=document.getElementById("area"), placeEl=document.getElementById("place");
  const dateEl=document.getElementById("date"), timeEl=document.getElementById("time"), costEl=document.getElementById("cost");

  const game={
   id:Date.now(),format:formatEl.value,area:areaEl.value,place:placeEl.value.trim(),address:areaEl.value,
   map:placeEl.dataset.map||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(placeEl.value+" "+areaEl.value)}`,
   date:dateEl?.value||"Νέα ημερομηνία",time:timeEl?.value||"20:00",
   need:needs[0]?.position||null,needs,playerCount:needs.length,count:0,max:m,
   cost:costEl?.value||"—",creator:profile.name,teamId:teamEl?.value||null,
   desc:descEl?.value.trim()||`Ψάχνουμε ${needs.length} ${needs.length===1?"παίκτη":"παίκτες"} για ${formatEl.value}.`,
   applications:[]
  };
  games.unshift(game);
  closeModal();renderGames();
 }catch(err){console.error(err);alert("Η αγγελία δεν δημοσιεύτηκε. Δοκίμασε ξανά.")}
}

<script id="enjoyfoot-datetime-pickers">
(function(){
  function applyDateTimePickers(){
    const fields=[...document.querySelectorAll('input, textarea, select')];
    fields.forEach(el=>{
      const meta=((el.getAttribute('name')||'')+' '+(el.id||'')+' '+(el.getAttribute('placeholder')||'')+' '+(el.getAttribute('aria-label')||'')).toLowerCase();
      const label=el.previousElementSibling ? (el.previousElementSibling.textContent||'').toLowerCase() : '';
      const text=meta+' '+label;

      const isDate=/(date|datum|ημερομην|ημερομηνία|day)/.test(text);
      const isTime=/(time|ora|ώρα|hour|start_time|end_time)/.test(text);

      if(isDate && el.tagName==='INPUT' && el.type!=='date'){
        el.type='date';
        el.removeAttribute('pattern');
        el.setAttribute('inputmode','none');
      }
      if(isTime && el.tagName==='INPUT' && el.type!=='time'){
        el.type='time';
        el.removeAttribute('pattern');
        el.setAttribute('inputmode','none');
      }
    });
  }

  applyDateTimePickers();
  const observer=new MutationObserver(applyDateTimePickers);
  observer.observe(document.body,{childList:true,subtree:true});
})();
</script>


<script id="enjoyfoot-venue-picker">
(function(){
  const CONFIG={googleMapsApiKey:"AIzaSyDpdTGrGSMC1OZPTKhhfe45Ew3pn6vxbc0"};

  function makeVenuePicker(){
    const candidates=[...document.querySelectorAll('input,textarea')];
    const input=candidates.find(el=>{
      const s=((el.name||"")+" "+(el.id||"")+" "+(el.placeholder||"")+" "+(el.getAttribute("aria-label")||"")).toLowerCase();
      return /(γήπεδο|γηπεδο|venue|field|stadium|pitch)/.test(s);
    });
    if(!input || input.dataset.venuePicker==="1") return;
    input.dataset.venuePicker="1";

    const wrap=document.createElement("div");
    wrap.className="enjoy-venue-picker";
    input.parentNode.insertBefore(wrap,input);
    wrap.appendChild(input);

    const status=document.createElement("div");
    status.className="enjoy-venue-status";
    status.textContent="Αναζήτησε το γήπεδο και επίλεξε το σωστό αποτέλεσμα.";
    wrap.appendChild(status);

    const selected=document.createElement("div");
    selected.className="enjoy-venue-selected";
    selected.hidden=true;
    wrap.appendChild(selected);

    function init(){
      if(!window.google?.maps?.places?.Autocomplete){
        status.textContent="Η αναζήτηση Google Maps θα ενεργοποιηθεί μόλις προστεθεί το Google Maps API key.";
        return;
      }
      const ac=new google.maps.places.Autocomplete(input,{
        types:["establishment"],
        fields:["place_id","name","formatted_address","geometry"]
      });
      ac.addListener("place_changed",()=>{
        const p=ac.getPlace();
        if(!p.place_id) return;
        input.value=p.name||"";
        input.dataset.placeId=p.place_id;
        input.dataset.lat=p.geometry?.location?.lat?.() ?? "";
        input.dataset.lng=p.geometry?.location?.lng?.() ?? "";
        input.dataset.address=p.formatted_address||"";
        selected.hidden=false;
        selected.textContent=(p.name||"")+(p.formatted_address?" • "+p.formatted_address:"");
        status.textContent="✓ Επιλέχθηκε το συγκεκριμένο γήπεδο.";
      });
    }

    if(CONFIG.googleMapsApiKey && !CONFIG.googleMapsApiKey.includes("REPLACE_")){
      const s=document.createElement("script");
      s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(CONFIG.googleMapsApiKey)+"&libraries=places&callback=enjoyFootInitVenuePicker";
      s.async=true;s.defer=true;
      document.head.appendChild(s);
      window.enjoyFootInitVenuePicker=init;
    }else{
      init();
    }
  }

  window.enjoyFootVenuePicker=makeVenuePicker;
  makeVenuePicker();
  new MutationObserver(makeVenuePicker).observe(document.body,{childList:true,subtree:true});
})();
</script>

<script id="enjoyfoot-create-ad-fix">
(function(){
  function wireCreateButtons(){
    const buttons=[...document.querySelectorAll('button,input[type="submit"],a')];
    buttons.forEach(btn=>{
      const text=(btn.textContent||btn.value||"").trim().toLowerCase();
      if(!/(δημιουργία|δημιουργησε|create|publish|δημοσίευση)/.test(text)) return;
      if(btn.dataset.createFix==="1") return;
      btn.dataset.createFix="1";

      btn.addEventListener("click", function(){
        // Let the app's existing handler run first.
        setTimeout(function(){
          // If a venue picker exists, copy its selected Google values into common hidden fields.
          const venueInput=document.querySelector('input[data-place-id]');
          if(venueInput){
            const form=btn.closest("form") || document.querySelector("form");
            if(form){
              const values={
                venue_place_id:venueInput.dataset.placeId||"",
                venue_lat:venueInput.dataset.lat||"",
                venue_lng:venueInput.dataset.lng||"",
                venue_address:venueInput.dataset.address||""
              };
              Object.entries(values).forEach(([name,value])=>{
                let h=form.querySelector('[name="'+name+'"]');
                if(!h){
                  h=document.createElement("input");
                  h.type="hidden"; h.name=name;
                  form.appendChild(h);
                }
                h.value=value;
              });
            }
          }
        },50);
      }, {capture:false});
    });
  }

  wireCreateButtons();
  new MutationObserver(wireCreateButtons).observe(document.body,{childList:true,subtree:true});
})();
