<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>enjoyfootgr</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#f5f7ff}
header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:#111a31;position:sticky;top:0;z-index:5}
.logo{font-weight:900;font-size:24px}.logo span{color:#53e36b}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}
.primary{background:#53e36b;color:#07120a}.ghost{background:#222d4a;color:#fff}
main{max-width:1100px;margin:auto;padding:28px 18px}
.hero{background:linear-gradient(135deg,#16284a,#102719);padding:30px;border-radius:20px;margin-bottom:24px}
.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:#b9c4d9}
.actions{display:flex;gap:10px;flex-wrap:wrap}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input,select,textarea{background:#121b31;border:1px solid #30405f;color:#fff;padding:11px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:#121a2e;border:1px solid #263653;border-radius:16px;padding:18px}
.badge{display:inline-block;background:#243653;padding:5px 9px;border-radius:99px;font-size:12px;margin:3px}
.open{color:#53e36b}.full{color:#ff6b6b}.top{display:flex;justify-content:space-between;gap:12px}
.rating{font-size:30px;font-weight:900;color:#ffd45c}.players{margin:15px 0;height:8px;background:#28344f;border-radius:20px}.players i{display:block;height:100%;background:#53e36b;border-radius:20px}
.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;background:#263653}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{background:#111a2f;border:1px solid #334667;border-radius:18px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#1a2540;padding:10px;border-radius:10px;text-align:center}.stat b{display:block;font-size:22px}
.profile{display:flex;gap:18px;align-items:center}.small{color:#9eabc2;font-size:13px}
.notice{padding:12px;background:#1b2a43;border-radius:10px;margin-top:10px}
@media(max-width:600px){.hero h1{font-size:30px}.row{grid-template-columns:1fr}.profile{align-items:flex-start}}

.fieldbox{background:#18243c;border:1px solid #30405f;border-radius:12px;padding:12px;margin:12px 0}
.fieldtitle{font-weight:900;font-size:16px}.fieldaddr{font-size:13px;color:#aebbd1;margin:5px 0}
.mapbtn{display:inline-block;text-decoration:none;background:#243653;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;margin-top:5px}
.areaTabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}.areaTabs button.active{background:#53e36b;color:#07120a}

.requests{margin-top:14px;border-top:1px solid #30405f;padding-top:12px}.request{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#18243c;border-radius:10px;padding:9px;margin:6px 0}.mini{font-size:12px;color:#aebbd1}
.usercard{display:flex;gap:12px;align-items:center}.miniavatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#263653}

.areaSearchWrap{position:relative;min-width:230px}.areaSearchWrap input{width:100%;margin-bottom:6px}.areaSearchWrap select{width:100%;max-height:180px}
.areaHint{font-size:12px;color:#91a0b9;margin-top:4px}

.chat{display:grid;gap:8px;margin:12px 0}.msg{padding:9px 12px;border-radius:12px;background:#1b2944;max-width:85%}.msg.me{margin-left:auto;background:#244c35}.chatinput{display:flex;gap:8px}.chatinput input{flex:1}.notif{background:#243653;border-radius:10px;padding:10px;margin:7px 0}

.authbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.userpill{background:#1c2a43;padding:8px 11px;border-radius:10px;font-size:13px}.authstatus{margin-top:10px;color:#aebbd1}.error{background:#4b1f27;color:#ffd9de;padding:10px;border-radius:10px}.success{background:#183a27;color:#d9ffe7;padding:10px;border-radius:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* enjoyfootgr stable form polish */
.form input[type="date"], .form input[type="time"]{
  min-height:46px; cursor:pointer; font-size:16px;
}
.form input[type="date"]::-webkit-calendar-picker-indicator,
.form input[type="time"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.9}
.create-date-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.create-date-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">⚽ enjoy<span>footgr</span></div><button class="ghost" onclick="openProfile()">👤 Το προφίλ μου</button></header>
<main>
<section class="hero">
<h1>Βρες παίκτη. Φτιάξε ομάδα. Παίξε στο enjoyfootgr.</h1>
<p>Αγγελίες για 5x5, 7x7 και 11x11 — με πραγματικά γήπεδα και προφίλ παικτών σε στυλ FIFA.</p>
<div class="actions"><button class="primary" onclick="openCreate()">＋ Δημιούργησε αγγελία</button><button class="ghost" onclick="showPlayers()">👥 Βρες παίκτη</button><button class="ghost" onclick="showMyApplications()">📩 Τα αιτήματά μου</button></div>
</section>
<div class="filters">
<select id="formatFilter" onchange="renderGames()"><option value="">⚽ Όλα τα formats</option><option value="5x5">5x5</option><option value="7x7">7x7</option><option value="11x11">11x11</option></select>
<div class="areaSearchWrap"><input id="areaSearch" placeholder="📍 Γράψε περιοχή ή πόλη..." oninput="filterAreas()"><select id="areaFilter" onchange="renderGames()"><option value="">📍 Όλη η Ελλάδα</option></select></div>
<select id="positionFilter" onchange="renderGames()"><option value="">Όλες οι θέσεις</option><option>GK</option><option>CB</option><option>LB</option><option>RB</option><option>CDM</option><option>CM</option><option>CAM</option><option>LM</option><option>RM</option><option>LW</option><option>RW</option><option>ST</option></select>
<input id="search" placeholder="🔎 Περιοχή / θέση / γήπεδο" oninput="renderGames()"></div>
<h2>🔥 Διαθέσιμα παιχνίδια</h2><div id="games" class="grid"></div>
</main>

<div class="modal" id="modal"><div class="modalbox" id="modalContent"></div></div>

<script>
const greekAreas=["Αθήνα","Αιγάλεω","Άλιμος","Αμαλιάδα","Αλεξανδρούπολη","Άργος","Άρτα","Βέροια","Βόλος","Γιάννενα","Γρεβενά","Δράμα","Έδεσσα","Ελευσίνα","Ηράκλειο","Θεσσαλονίκη","Θήβα","Καβάλα","Καλαμάτα","Καλλιθέα","Καρδίτσα","Κατερίνη","Καλαμαριά","Καστοριά","Κέρκυρα","Κιλκίς","Κοζάνη","Κομοτηνή","Κόρινθος","Λαμία","Λάρισα","Λευκάδα","Λιβαδειά","Μαρούσι","Μεσολόγγι","Μυτιλήνη","Νέα Σμύρνη","Νάουσα","Ναύπλιο","Ξάνθη","Πάτρα","Πειραιάς","Πρέβεζα","Ρέθυμνο","Ρόδος","Ρέντη","Σέρρες","Σπάρτη","Τρίκαλα","Τρίπολη","Χαλκίδα","Χανιά","Χίος","Ζωγράφου","Γέρακας","Καματερό","Σαλαμίνα","Σύρος","Κως"];
function populateAreas(list=greekAreas){
 const s=document.getElementById("areaFilter"); if(!s)return;
 const old=s.value; s.innerHTML='<option value="">📍 Όλη η Ελλάδα</option>'+list.map(a=>`<option>${a}</option>`).join('');
 if(list.includes(old)) s.value=old;
}
function filterAreas(){
 const q=(document.getElementById("areaSearch").value||"").trim().toLowerCase();
 const list=greekAreas.filter(a=>a.toLowerCase().includes(q));
 populateAreas(list);
 populateAreas();renderGames();
}
let games=[
{id:1,format:"5x5",area:"Καλλιθέα",place:"Δημοτικό Γήπεδο Μίνι Ποδοσφαίρου 5x5 Καλλιθέας",address:"Π. Τσαλδάρη & Μενελάου, Καλλιθέα 176 76",map:"https://www.google.com/maps/search/?api=1&query=Π+Τσαλδάρη+Μενελάου+Καλλιθέα",date:"Παρασκευή 22/8",time:"21:00",need:"GK",count:9,max:10,cost:"7€",creator:"Μάριος",desc:"Χρειαζόμαστε τερματοφύλακα.",applications:[]},
{id:2,format:"7x7",area:"Ρέντη",place:"Renti Arena",address:"Αγίας Άννης 46, Άγιος Ιωάννης Ρέντης 182 33",map:"https://www.google.com/maps/search/?api=1&query=Renti+Arena+Agias+Annis+46+Rentis",date:"Σάββατο 23/8",time:"20:30",need:"CM",count:11,max:14,cost:"6€",creator:"Γιάννης",desc:"Ψάχνουμε 3 άτομα για κέντρο και άμυνα.",applications:[]},
{id:3,format:"11x11",area:"Μαρούσι",place:"Campeon Football Club",address:"Παράδρομος 3ης Φραγκ. 5, Μαρούσι 151 25",map:"https://www.google.com/maps/search/?api=1&query=Campeon+Football+Club+Marousi",date:"Κυριακή 24/8",time:"19:00",need:"RB",count:19,max:22,cost:"8€",creator:"Αλέξης",desc:"Ψάχνουμε δεξί μπακ, εξτρέμ και φορ.",applications:[]},
{id:4,format:"7x7",area:"Γέρακας",place:"PLANET ONE",address:"Κλεισθένους 399, Γέρακας 153 44",map:"https://www.google.com/maps/search/?api=1&query=Planet+One+Kleisthenous+399+Gerakas",date:"Τρίτη 26/8",time:"21:30",need:"ST",count:12,max:14,cost:"8€",creator:"Νίκος",desc:"Χρειαζόμαστε 2 επιθετικούς.",applications:[]},
{id:5,format:"5x5",area:"Ζωγράφου",place:"Γήπεδο Ποδοσφαίρου 5x5",address:"Κοκκινοπούλου, Ζωγράφου 157 73",map:"https://www.google.com/maps/search/?api=1&query=Γήπεδο+Ποδοσφαίρου+5x5+Κοκκινοπούλου+Ζωγράφου",date:"Τετάρτη 27/8",time:"20:00",need:"LW",count:8,max:10,cost:"6€",creator:"Πέτρος",desc:"Ψάχνουμε αριστερό εξτρέμ και έναν χαφ.",applications:[]},
{id:6,format:"7x7",area:"Καματερό",place:"MARAKANA 7x7",address:"Αριστείδου 82, Καματερό 134 51",map:"https://www.google.com/maps/search/?api=1&query=MARAKANA+7x7+Aristidou+82+Kamatero",date:"Πέμπτη 28/8",time:"21:00",need:"CB",count:10,max:14,cost:"7€",creator:"Κώστας",desc:"Ψάχνουμε αμυντικούς.",applications:[]}
];
let messages={1:[{from:"Μάριος",text:"Καλησπέρα! Είσαι διαθέσιμος για Παρασκευή 21:00;"}],2:[],3:[],4:[],5:[],6:[]};
let profile={name:"Stelios",age:31,height:172,weight:73,position:"MID",foot:"Δεξί",rating:78,stats:{PAC:82,SHO:70,PAS:84,DRI:79,DEF:62,PHY:76},photo:""};

function positionGR(p){return ({GK:"Τερματοφύλακας",CB:"Στόπερ",LB:"Αριστερό Μπακ",RB:"Δεξί Μπακ",CDM:"Αμυντικό Χαφ",CM:"Κεντρικό Χαφ",CAM:"Μεσοεπιθετικός",LM:"Αριστερό Χαφ",RM:"Δεξί Χαφ",LW:"Αριστερό Εξτρέμ",RW:"Δεξί Εξτρέμ",ST:"Σέντερ Φορ"})[p]||p}
function renderGames(){
 const q=(document.getElementById('search').value||'').toLowerCase(), f=document.getElementById('positionFilter').value, fmt=document.getElementById('formatFilter').value, area=document.getElementById('areaFilter').value, aq=(document.getElementById('areaSearch').value||'').trim().toLowerCase();
 document.getElementById('games').innerHTML=games.filter(g=>(!fmt||g.format===fmt)&&(!area||g.area===area)&&(!aq||g.area.toLowerCase().includes(aq))&&(!f||g.need===f)&&(!q||(g.area+g.place+g.need+g.format+g.address).toLowerCase().includes(q))).map(g=>{
  let full=g.count>=g.max, left=g.max-g.count;
  return `<div class="card"><div class="top"><div><span class="badge">⚽ ${g.format}</span><span class="badge">${g.area}</span><span class="badge">${positionGR(g.need)}</span></div><b class="${full?'full':'open'}">${full?'🔴 ΚΑΤΕΛΗΦΘΗ':'🟢 ΑΝΟΙΧΤΟ'}</b></div>
  <h3>Ψάχνουμε ${left} ${left===1?'παίκτη':'παίκτες'}</h3><p>${g.desc}</p>
  <div class="fieldbox"><div class="fieldtitle">📍 ${g.place}</div><div class="fieldaddr">${g.address}</div><a class="mapbtn" href="${g.map}" target="_blank" rel="noopener">🗺️ Google Maps</a><a class="mapbtn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(g.address)}" target="_blank" rel="noopener">🚗 Οδηγίες</a></div>
  <p>📅 ${g.date} · 🕘 ${g.time}<br>💰 ${g.cost}</p>
  <div class="players"><i style="width:${g.count/g.max*100}%"></i></div><b>${g.count}/${g.max} παίκτες</b>
  ${full?'<button class="ghost" style="width:100%;margin-top:14px" disabled>Η αγγελία έκλεισε</button>':'<button class="primary" style="width:100%;margin-top:14px" onclick="requestJoin('+g.id+')">🙋 Θέλω να παίξω</button>'}
  <div class="requests"><b>👥 Ενδιαφέρονται: ${g.applications.length}</b>${g.applications.length?g.applications.map((p,i)=>`<div class="request"><span>⚽ ${p.name} · ${positionGR(p.position)} · ${p.rating} OVR</span><span><button class="ghost" onclick="openChat(${g.id})">💬</button> <button class="primary" onclick="acceptPlayer(${g.id},${i})">Αποδοχή</button></span></div>`).join(''):'<div class="mini">Κανένας παίκτης δεν έχει στείλει αίτημα ακόμα.</div>'}<button class="ghost" style="width:100%;margin-top:7px" onclick="openChat(${g.id})">💬 Άνοιγμα chat αγγελίας</button></div>
  </div>`}).join('')||'<div class="notice">Δεν βρέθηκαν αγγελίες.</div>';
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openCreate(){
 document.getElementById('modalContent').innerHTML=`<h2>＋ Νέα αγγελία</h2><div class="form">
<select id="format" onchange="updateMax()"><option value="5x5">⚽ 5x5 — 10 παίκτες</option><option value="7x7">⚽ 7x7 — 14 παίκτες</option><option value="11x11">⚽ 11x11 — 22 παίκτες</option></select>
<input id="fieldSearch" placeholder="🔎 Ψάξε γήπεδο στην περιοχή..." oninput="searchFields()"><select id="field" onchange="syncField()"><option value="custom">➕ Άλλο / γράψε γήπεδο</option><option value="Champions Club 5x5 7x7|Ευίας 6, Γέρακας|https://www.google.com/maps/search/?api=1&query=Champions+Club+5x5+7x7+Gerakas">Champions Club 5x5 7x7 — Γέρακας</option><option value="SOCCER ACTION|Χατζηανέστη 31, Άγιος Ιωάννης Ρέντης|https://www.google.com/maps/search/?api=1&query=SOCCER+ACTION+Rentis">SOCCER ACTION — Ρέντης</option><option value="Renti Arena|Αγίας Άννης 46, Άγιος Ιωάννης Ρέντης|https://www.google.com/maps/search/?api=1&query=Renti+Arena+Agias+Annis+46+Rentis">Renti Arena — Ρέντης</option><option value="AFC Chalandri|Εριφύλης 9, Χαλάνδρι|https://www.google.com/maps/search/?api=1&query=AFC+Chalandri+Erifilis+9">AFC Chalandri — Χαλάνδρι</option><option value="Ολυμπιακό Στάδιο|Λεωφ. Ολυμπιονίκου Σπύρου Λούη 1, Μαρούσι|https://www.google.com/maps/search/?api=1&query=Olympic+Stadium+Athens">Ολυμπιακό Στάδιο — Μαρούσι</option></select>
<input id="area" placeholder="Περιοχή" value="Καλλιθέα"><input id="place" placeholder="Γήπεδο" value="Athens Football Arena">
<div class="row"><input id="date" min="" placeholder="Ημερομηνία"><input id="time" placeholder="Ώρα"></div>
<div class="row"><select id="need"><option value="GK">Τερματοφύλακας</option><option value="CB">Στόπερ</option><option value="LB">Αριστερό Μπακ</option><option value="RB">Δεξί Μπακ</option><option value="CDM">Αμυντικό Χαφ</option><option value="CM" selected>Κεντρικό Χαφ</option><option value="CAM">Μεσοεπιθετικός</option><option value="LM">Αριστερό Χαφ</option><option value="RM">Δεξί Χαφ</option><option value="LW">Αριστερό Εξτρέμ</option><option value="RW">Δεξί Εξτρέμ</option><option value="ST">Σέντερ Φορ</option></select><input id="cost" placeholder="Κόστος" value="7€"></div>
<textarea id="desc" placeholder="Τι παίκτη ψάχνεις;"></textarea><div id="maxInfo" class="notice">Χωρητικότητα: 10 παίκτες</div>
<div class="actions"><button class="primary" onclick="createGame()">Δημοσίευση</button><button class="ghost" onclick="closeModal()">Άκυρο</button></div></div>`;document.getElementById('modal').classList.add('show');
}
function searchFields(){
 const q=(document.getElementById("fieldSearch").value||"").toLowerCase();
 const s=document.getElementById("field"), opts=[...s.options];
 opts.forEach(o=>{ if(o.value==="custom"||!q){o.hidden=false}else{o.hidden=!o.textContent.toLowerCase().includes(q)} });
}
function updateMax(){let m={"5x5":10,"7x7":14,"11x11":22}[format.value];maxInfo.textContent=`Χωρητικότητα: ${m} παίκτες`;}
function syncField(){if(!document.getElementById("field"))return;if(field.value!=="custom"){let [n,a,u]=field.value.split("|");place.value=n;area.value=a.includes("Ρέντη")?"Ρέντη":a.includes("Γέρακας")?"Γέρακας":a.includes("Μαρούσι")?"Μαρούσι":area.value;place.dataset.map=u}else{place.dataset.map=""}}
function createGame(){let m={"5x5":10,"7x7":14,"11x11":22}[format.value];games.unshift({id:Date.now(),format:format.value,area:area.value,place:place.value,address:area.value,map:place.dataset.map||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.value+" "+area.value)}`,date:date.value||"Νέα ημερομηνία",time:time.value||"20:00",need:need.value,count:m-1,max:m,cost:cost.value||"—",creator:profile.name,desc:desc.value||`Ψάχνουμε 1 παίκτη για ${format.value}.`,applications:[]});closeModal();renderGames()}
function requestJoin(id){
 let g=games.find(x=>x.id===id);
 if(g.applications.some(p=>p.name===profile.name)){openChat(id);return}
 g.applications.push({name:profile.name,position:profile.position,rating:profile.rating});
 if(!messages[id])messages[id]=[];
 messages[id].push({from:profile.name,text:"Γεια! Ενδιαφέρομαι να παίξω στην αγγελία σου."});
 alert("Το αίτημά σου στάλθηκε! Μπορείς τώρα να στείλεις μήνυμα.");
 renderGames();
 openChat(id);
}
function acceptPlayer(id,i){
 let g=games.find(x=>x.id===id), p=g.applications[i];
 if(g.count>=g.max){alert("Η ομάδα είναι ήδη πλήρης.");return}
 g.count++; g.applications.splice(i,1);
 if(!messages[id])messages[id]=[];
 messages[id].push({from:g.creator,text:`Ο ${p.name} έγινε δεκτός στην ομάδα! Καλώς ήρθες.`});
 alert(`${p.name} προστέθηκε στην ομάδα! ${g.count}/${g.max}`);
 renderGames();
}
function openChat(id){
 const g=games.find(x=>x.id===id); if(!g)return;
 if(!messages[id])messages[id]=[];
 document.getElementById('modalContent').innerHTML=`<h2>💬 ${g.format} · ${g.area}</h2><div class="mini">${g.place} · ${g.date} · ${g.time}</div>
 <div class="chat" id="chatbox">${messages[id].map(m=>`<div class="msg ${m.from===profile.name?'me':''}"><b>${m.from}</b><br>${m.text}</div>`).join('')}</div>
 <div class="chatinput"><input id="chatText" placeholder="Γράψε μήνυμα..." onkeydown="if(event.key==='Enter')sendMessage(${id})"><button class="primary" onclick="sendMessage(${id})">Αποστολή</button></div>
 <button class="ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Κλείσιμο</button>`;
 document.getElementById('modal').classList.add('show');
}
function sendMessage(id){
 const input=document.getElementById('chatText'); const text=(input.value||'').trim(); if(!text)return;
 if(!messages[id])messages[id]=[]; messages[id].push({from:profile.name,text});
 openChat(id);
}
function showMyApplications(){
 let sent=games.filter(g=>g.applications.some(p=>p.name===profile.name));

function saveProfile(){
profile.name=pname.value;profile.age=+page.value;profile.height=+pheight.value;profile.weight=+pweight.value;profile.position=ppos.value;profile.foot=pfoot.value;
Object.keys(profile.stats).forEach(k=>profile.stats[k]=Math.max(1,Math.min(99,+document.getElementById('st_'+k).value||1)));
profile.rating=Math.round(Object.values(profile.stats).reduce((a,b)=>a+b,0)/6);
let f=photo.files[0];if(f){let r=new FileReader();r.onload=()=>{profile.photo=r.result;openProfile()};r.readAsDataURL(f)}else openProfile();
}

 const {data}=await sb.auth.getUser(); currentUser=data.user||null;

  const {data:p}=await sb.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();

   profile.name=p.display_name||"Παίκτης";profile.age=p.age||31;profile.height=p.height_cm||172;profile.weight=p.weight_kg||73;

async function signup(){
 const email=authEmail.value.trim(),password=authPassword.value;
 if(password.length<6){authMsg.innerHTML='<div class="error">Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.</div>';return}
 const {data,error}=await sb.auth.signUp({email,password});
 authMsg.innerHTML=error?`<div class="error">${esc(error.message)}</div>`:'<div class="success">Η εγγραφή έγινε. Έλεγξε το email σου αν ζητηθεί επιβεβαίωση.</div>';
 if(data.user)await refreshAuth();
}
async function login(){
 const {error}=await sb.auth.signInWithPassword({email:authEmail.value.trim(),password:authPassword.value});
 authMsg.innerHTML=error?`<div class="error">${esc(error.message)}</div>`:'<div class="success">Συνδέθηκες!</div>';
 if(!error){await refreshAuth();await loadGames();setTimeout(closeModal,500)}
}
async function logout(){await sb.auth.signOut();await refreshAuth();await loadGames();alert("Έγινε αποσύνδεση.")}

async function loadApplications(){
 if(!currentUser)return;
 for(const g of games){
  const {data}=await sb.from("game_applications").select("id,player_id,position,status,profiles(display_name,overall)").eq("game_id",g.id).eq("status","pending");
  g.applications=(data||[]).map(x=>({id:x.id,player_id:x.player_id,name:x.profiles?.display_name||"Παίκτης",position:x.position||"CM",rating:x.profiles?.overall||50,status:x.status}));
 }
}

async function loadGames(){
 const {data,error}=await sb.from("games").select("*, fields(*)").eq("is_cancelled",false).order("game_date",{ascending:true}).order("game_time",{ascending:true});
 if(error){console.error(error);return}
 games=(data||[]).map(g=>({
  id:g.id,format:g.format,area:g.area||g.city,place:g.fields?.name||"Γήπεδο",
  address:g.fields?.address||g.city,map:g.fields?.google_maps_url||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((g.fields?.name||"Γήπεδο")+" "+(g.area||g.city))}`,
  date:g.game_date,time:String(g.game_time).slice(0,5),need:g.needed_position,count:g.current_players,max:g.max_players,
  cost:g.price==null?"—":g.price+"€",creator:g.creator_id,desc:g.description||"",applications:[]
 }));
 await loadApplications();renderGames();
}

async function createGame(){
 if(!currentUser){openAuth();return}
 const m={"5x5":10,"7x7":14,"11x11":22}[format.value];let fieldId=null;
 if(field.value!=="custom"){
  const [n,addr,url]=field.value.split("|");
  const {data:ex}=await sb.from("fields").select("id").eq("name",n).eq("address",addr).maybeSingle();
  if(ex)fieldId=ex.id;
  else{
   const {data:nf,error}=await sb.from("fields").insert({name:n,address:addr,city:area.value,area:area.value,google_maps_url:url,supports_5x5:format.value==="5x5",supports_7x7:format.value==="7x7",supports_11x11:format.value==="11x11"}).select("id").single();
   if(error){alert(error.message);return} fieldId=nf.id;
  }
 }
 const {error}=await sb.from("games").insert({
  creator_id:currentUser.id,format:format.value,title:`Ψάχνουμε 1 ${positionGR(need.value)}`,
  description:desc.value||`Ψάχνουμε 1 παίκτη για ${format.value}.`,field_id:fieldId,
  city:area.value,area:area.value,game_date:date.value||new Date().toISOString().slice(0,10),
  game_time:time.value||"20:00",price:parseFloat(cost.value)||null,max_players:m,current_players:1,
  needed_position:need.value,needed_players:1
 });
 if(error){alert(error.message);return}
 closeModal();await loadGames();alert("Η αγγελία δημοσιεύτηκε!");
}

async function acceptPlayer(id,i){
 if(!currentUser)return;
 const g=games.find(x=>x.id===id),p=g?.applications[i];if(!g||!p)return;
 const {error:e1}=await sb.from("game_applications").update({status:"accepted"}).eq("id",p.id);
 if(e1){alert(e1.message);return}
 const {error:e2}=await sb.from("game_members").insert({game_id:id,player_id:p.player_id,position:p.position});
 if(e2){alert(e2.message);return}
 await loadGames();alert(`${p.name} προστέθηκε στην ομάδα!`);
}

<script>
/* EnjoyFootGR — real player search via Supabase */
const ENJOYFOOT_SUPABASE_URL = "https://uqmpxjsuvzuqowmyscoh.supabase.co";
const ENJOYFOOT_SUPABASE_KEY = "sb_publishable_y1_9Eu2rE5glmxPquDEtSw_6HQle5Wt";

async function enjoyFootSearchPlayers(term) {
  const q = (term || "").trim();
  if (!q) return [];

  const url =
    ENJOYFOOT_SUPABASE_URL +
    "/rest/v1/profiles?select=id,username,display_name,avatar_url,primary_position,secondary_position,overall,city,area&or=" +
    encodeURIComponent(
      `(display_name.ilike.*${q}*,username.ilike.*${q}*,city.ilike.*${q}*,area.ilike.*${q}*)`
    ) +
    "&limit=30";

  const res = await fetch(url, {
    headers: {
      apikey: ENJOYFOOT_SUPABASE_KEY,
      Authorization: "Bearer " + ENJOYFOOT_SUPABASE_KEY
    }
  });

  if (!res.ok) throw new Error("Αποτυχία αναζήτησης παικτών.");
  return await res.json();
}

window.enjoyFootSearchPlayers = enjoyFootSearchPlayers;
</script>


<div id="enjoyfoot-real-search" style="margin:16px 0;">
  <input id="playerSearch" type="search" placeholder="Αναζήτηση παικτών..." 
    style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid #ccc;font-size:16px;">
  <div id="playerSearchResults" style="margin-top:10px;"></div>
</div>
<script>
(function () {
  const input = document.getElementById("playerSearch");
  const results = document.getElementById("playerSearchResults");
  if (!input || !results || !window.enjoyFootSearchPlayers) return;

  let timer;
  input.addEventListener("input", function () {
    clearTimeout(timer);
    const term = input.value.trim();
    if (!term) { results.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      try {
        const players = await window.enjoyFootSearchPlayers(term);
        if (!players.length) {
          results.innerHTML = '<div style="padding:12px;opacity:.7">Δεν βρέθηκαν παίκτες.</div>';
          return;
        }
        results.innerHTML = players.map(p => `
          <div data-player-id="${p.id}" style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer;">
            <img src="${p.avatar_url || ''}" onerror="this.style.display='none'" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">
            <div>
              <strong>${p.display_name || p.username || 'Παίκτης'}</strong>
              <div style="font-size:13px;opacity:.75">${p.primary_position || ''}${p.city ? ' • '+p.city : ''}${p.overall ? ' • '+p.overall : ''}</div>
            </div>
          </div>`).join("");
      } catch (e) {
        results.innerHTML = '<div style="padding:12px;color:#b00">Η αναζήτηση δεν μπόρεσε να ολοκληρωθεί.</div>';
      }
    }, 250);
  });
})();
</script>
